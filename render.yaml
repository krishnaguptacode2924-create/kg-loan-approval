services:
  - type: web
    name: kg-loan-approval
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn KG_Loan_Predict_API:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
